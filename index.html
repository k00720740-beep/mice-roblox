<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<title>مايك روبلوكس</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#fff;font-family:'Cairo',system-ui,sans-serif;text-align:center}
.card{background:#1a1d24;padding:32px;border-radius:20px;width:min(90vw,360px)}
button{font:inherit;font-weight:700;background:#2e7d32;color:#fff;border:0;border-radius:12px;padding:14px 24px;width:100%;cursor:pointer}
#bar{height:10px;background:#333;border-radius:5px;overflow:hidden;margin:16px 0}#fill{height:100%;width:0;background:#4caf50}</style>
<div class="card"><h2>مايك روبلوكس</h2>
<p>الحساب: <b id="name">...</b></p>
<button id="link">ربط الحساب وتفعيل المايك</button>
<div id="bar"><div id="fill"></div></div>
<p id="status">ارجع للعبة بعد الربط، واضغط زر المايك هناك.</p></div>
<script>
const t=new URLSearchParams(location.search).get('t'),$=id=>document.getElementById(id);
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
const BOOST=5;      // تكبير صوت اللي تسمعهم
const MIC_BOOST=3;  // تكبير صوتك قبل الإرسال
let ws,me,stream,ctx,on=false,near={},peers={};
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send({type:'hello',t,ready:!!stream});
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type=='hello'){me=m;$('name').textContent=m.name}
    else if(m.type=='bad'){$('status').textContent='الرابط منتهي، اطلب رابط جديد من اللعبة.';$('link').style.display='none'}
    else if(m.type=='state')onState(m);
    else if(m.type=='signal')onSignal(m)};
  ws.onclose=()=>setTimeout(connect,2000);
}
connect();
function limiter(){const c=ctx.createDynamicsCompressor();
  c.threshold.value=-24;c.knee.value=20;c.ratio.value=8;c.attack.value=0.003;c.release.value=0.2;return c}
$('link').onclick=async()=>{
  ctx=new AudioContext();await ctx.resume();
  let raw;
  try{raw=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch{return $('status').textContent='لازم تسمح للمايك'}
  const src=ctx.createMediaStreamSource(raw);
  const mg=ctx.createGain();mg.gain.value=MIC_BOOST;
  const dest=ctx.createMediaStreamDestination();
  src.connect(mg);mg.connect(limiter()).connect(dest);
  stream=dest.stream;stream.getAudioTracks()[0].enabled=false;
  const an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
  const buf=new Uint8Array(an.fftSize);
  setInterval(()=>{an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}
    let lv=on?Math.min(1,Math.sqrt(s/buf.length)*6):0;if(lv<0.04)lv=0;
    $('fill').style.width=lv*100+'%';send({type:'level',v:lv})},100);
  send({type:'ready'});$('link').style.display='none';
  $('status').textContent='تم الربط. ارجع للعبة واضغط زر المايك.';
};
function onState(m){
  on=m.on;if(stream)stream.getAudioTracks()[0].enabled=on;
  if(stream)$('status').textContent=on?'المايك شغال':'المايك مقفل';
  near={};m.near.forEach(n=>near[n.id]=n.g);
  for(const id in peers)if(!(id in near)){peers[id].pc.close();delete peers[id]}
  for(const id in near){
    if(!peers[id]&&stream&&Number(me.id)<Number(id))call(id);
    if(peers[id]&&peers[id].gain)peers[id].gain.gain.value=near[id]*BOOST;
  }
}
function mk(id){
  const pc=new RTCPeerConnection({iceServers:ICE}),p={pc,q:[],gain:null};
  stream.getTracks().forEach(tr=>pc.addTrack(tr,stream));
  pc.onicecandidate=e=>e.candidate&&send({type:'signal',to:id,data:{c:e.candidate}});
  pc.ontrack=e=>{const s=e.streams[0],a=new Audio();a.srcObject=s;a.muted=true;a.play().catch(()=>{});
    const g=ctx.createGain();g.gain.value=(near[id]||0)*BOOST;
    ctx.createMediaStreamSource(s).connect(g).connect(limiter()).connect(ctx.destination);p.gain=g};
  pc.onconnectionstatechange=()=>{if(pc.connectionState=='failed'&&peers[id]===p){pc.close();delete peers[id]}};
  peers[id]=p;return p;
}
async function call(id){const p=mk(id);await p.pc.setLocalDescription(await p.pc.createOffer());
  send({type:'signal',to:id,data:{sdp:p.pc.localDescription}})}
async function flush(p){for(const c of p.q)await p.pc.addIceCandidate(c).catch(()=>{});p.q=[]}
async function onSignal({from,data}){
  let p=peers[from];
  if(data.sdp){
    if(data.sdp.type=='offer'){
      if(!stream)return;if(p)p.pc.close();p=mk(from);
      await p.pc.setRemoteDescription(data.sdp);await flush(p);
      await p.pc.setLocalDescription(await p.pc.createAnswer());
      send({type:'signal',to:from,data:{sdp:p.pc.localDescription}});
    }else if(p){await p.pc.setRemoteDescription(data.sdp);await flush(p)}
  }else if(data.c&&p){p.pc.remoteDescription?p.pc.addIceCandidate(data.c).catch(()=>{}):p.q.push(data.c)}
}
</script></html>
